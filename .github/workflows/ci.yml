name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      flutter: ${{ steps.filter.outputs.flutter }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            flutter:
              - 'flutter_app/**'
              - 'packages/**'
              - '.github/workflows/ci.yml'
              - 'scripts/analyze-gate.sh'
              - 'scripts/check-auth-external-disabled.sh'
              - 'scripts/leak-scan.sh'
              - 'scripts/test-leak-scan.sh'

  flutter:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force || true
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: 'stable'

      - name: pub get (flutter_app)
        working-directory: flutter_app
        run: flutter pub get

      - name: pub get (packages/platform_wearables)
        working-directory: packages/platform_wearables
        run: flutter pub get

      - name: Gradle memory limits for CI runner
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError
          kotlin.daemon.jvmargs=-Xmx1g
          org.gradle.workers.max=2
          org.gradle.daemon=false
          EOF
          free -h

      - name: Analyze gate
        run: bash scripts/analyze-gate.sh

      - name: Auth external providers must stay disabled (H-M1)
        run: bash scripts/check-auth-external-disabled.sh

      - name: Run tests
        working-directory: flutter_app
        run: flutter test

      - name: Run demo-flow tests (DEMO_BUILD=true)
        working-directory: flutter_app
        run: flutter test --tags demo_flow --run-skipped --dart-define=DEMO_BUILD=true

      - name: Build debug APK
        working-directory: flutter_app
        run: flutter build apk --debug

      - name: Build web
        working-directory: flutter_app
        run: flutter build web

      - name: Upload Flutter build output
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build
          path: |
            flutter_app/build/web
            flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 1
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install root dependencies
        run: npm ci

      - name: Lint (root)
        run: |
          if node -e "process.exit(require('./package.json').scripts.lint ? 0 : 1)"; then
            npm run lint
          else
            echo "No root lint script, skipping."
          fi

      - name: Test (root)
        run: |
          if node -e "process.exit(require('./package.json').scripts.test ? 0 : 1)"; then
            npm test
          else
            echo "No root test script, skipping."
          fi

      - name: Build (root)
        run: npm run build

      - name: Install space/ dependencies
        working-directory: space
        run: npm ci

      - name: Lint (space)
        working-directory: space
        run: npm run lint

      - name: Build (space)
        working-directory: space
        run: npm run build

      - name: No external script/style hosts in built HTML/CSS (TC-032)
        run: python3 scripts/check-no-external-web-assets.py dist space/dist

      - name: Upload web build output
        if: matrix.node-version == 22
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: |
            dist
            space/dist
          retention-days: 1
          if-no-files-found: error

  supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install root dependencies
        run: npm ci

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # TC-021 item 9: type errors (e.g. TS18046 on an unknown catch value)
      # fail the build. Every function entrypoint plus the shared code.
      # TC-031: --frozen fails if deno.lock would change, so no import can
      # resolve to anything that is not already pinned in the lockfile.
      - name: Deno type check (all Edge Functions + shared code)
        run: deno check --frozen --config supabase/functions/deno.json supabase/functions/*/index.ts supabase/functions/_shared/*.ts

      - name: Deno unit tests (Edge Function shared code)
        run: deno test --frozen --config supabase/functions/deno.json supabase/functions/_shared

      - name: Deno unit tests (RevenueCat webhook auth, TC-026)
        run: deno test --frozen --config supabase/functions/deno.json supabase/functions/handle-revenuecat-webhook

      - name: Deno unit tests (partner API + webhook delivery, INT-01/02/03)
        run: deno test --frozen --config supabase/functions/deno.json supabase/functions/partner-api supabase/functions/deliver-webhooks

      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Start local Supabase (studio/storage/inbucket unused this card)
        run: supabase start -x studio,storage,inbucket

      - name: Reset DB + pgTAP
        run: |
          supabase db reset
          supabase test db

      - name: Run integration tests (CI=true -> hard-fail if env is missing)
        env:
          CI: 'true'
        run: bash scripts/integration-local.sh

  # TC-021 item 7: the real-app theme/focus/layout/axe check
  # (scripts/tc019_theme_check.py) runs in CI against a fresh local stack,
  # signed in for real with fictional seeded accounts. Captures are uploaded.
  theme-check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install root dependencies
        run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright (Chromium) + Pillow
        run: |
          python -m pip install 'playwright==1.64.0' 'pillow>=10,<14'
          python -m playwright install --with-deps chromium

      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Start local Supabase (studio/storage/inbucket unused)
        run: supabase start -x studio,storage,inbucket

      - name: Theme check (both themes, 1024 + 1440)
        run: python scripts/tc019_theme_check.py --screenshots round2-ci

      - name: Upload captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theme-check-captures
          path: docs/screenshots/tc-021/round2-ci
          retention-days: 14
          if-no-files-found: ignore

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Leak scan self-test (fails on missing build output)
        run: bash scripts/test-leak-scan.sh

      - name: App ID pin self-test (TC-021, team ID / watch ID / deep-link checks must catch regressions)
        run: bash scripts/test-check-app-id.sh

      - name: App ID pin (TC-020, store package name must not drift)
        run: bash scripts/check-app-id.sh

      - name: App icons pin self-test (TC-023, check must catch regressions)
        run: bash scripts/test-check-app-icons.sh

      - name: App icons pin (TC-023, Ava's handoff icons, no icon generator)
        run: bash scripts/check-app-icons.sh

      - name: Pinned imports self-test (TC-031, check must catch unpinned/CDN imports)
        run: bash scripts/test-check-pinned-imports.sh

      - name: Pinned imports (TC-031, no esm.sh or floating remote imports in Edge Functions)
        run: bash scripts/check-pinned-imports.sh

      - name: No external script/style hosts self-test (TC-032, check must catch CDN scripts/styles/import maps)
        run: bash scripts/test-check-no-external-web-assets.sh

      - name: No external script/style hosts in index.html (TC-032, Tailwind/React/fonts are bundled)
        run: python3 scripts/check-no-external-web-assets.py index.html space/index.html

      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Run gitleaks
        run: gitleaks git --config .gitleaks.toml --redact

      - name: No runtime references to the removed 'profiles' table (TC-026)
        run: bash scripts/check-no-profiles.sh

  leak-scan:
    needs: [changes, flutter, web]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.web.result == 'success' && (needs.flutter.result == 'success' || needs.flutter.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download web build output
        uses: actions/download-artifact@v4
        with:
          name: web-build

      - name: Download Flutter build output
        if: needs.flutter.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: flutter-build
          # upload-artifact roots a multi-path artifact at the paths' common
          # ancestor (flutter_app/build), so restore it there.
          path: flutter_app/build

      - name: Leak scan
        env:
          LEAK_SCAN_FLUTTER: ${{ needs.flutter.result == 'skipped' && 'skip' || '' }}
        run: bash scripts/leak-scan.sh
