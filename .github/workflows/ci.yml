name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force || true
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: 'stable'

      - name: pub get (flutter_app)
        working-directory: flutter_app
        run: flutter pub get

      - name: pub get (packages/platform_wearables)
        working-directory: packages/platform_wearables
        run: flutter pub get

      - name: Gradle memory limits for CI runner
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError
          kotlin.daemon.jvmargs=-Xmx1g
          org.gradle.workers.max=2
          org.gradle.daemon=false
          EOF
          free -h

      - name: Analyze gate
        run: bash scripts/analyze-gate.sh

      - name: Run tests
        working-directory: flutter_app
        run: flutter test

      - name: Build debug APK
        working-directory: flutter_app
        run: flutter build apk --debug

      - name: Build web
        working-directory: flutter_app
        run: flutter build web

  web:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install root dependencies
        run: npm ci

      - name: Lint (root)
        run: |
          if node -e "process.exit(require('./package.json').scripts.lint ? 0 : 1)"; then
            npm run lint
          else
            echo "No root lint script, skipping."
          fi

      - name: Test (root)
        run: |
          if node -e "process.exit(require('./package.json').scripts.test ? 0 : 1)"; then
            npm test
          else
            echo "No root test script, skipping."
          fi

      - name: Build (root)
        run: npm run build

      - name: Install space/ dependencies
        working-directory: space
        run: npm ci

      - name: Lint (space)
        working-directory: space
        run: npm run lint

      - name: Build (space)
        working-directory: space
        run: npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Run gitleaks
        run: gitleaks git --config .gitleaks.toml --redact

  leak-scan:
    needs: [flutter, web]
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force || true
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: 'stable'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: pub get (flutter_app)
        working-directory: flutter_app
        run: flutter pub get

      - name: Gradle memory limits for CI runner
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError
          kotlin.daemon.jvmargs=-Xmx1g
          org.gradle.workers.max=2
          org.gradle.daemon=false
          EOF
          free -h

      - name: Build web (root)
        run: |
          npm ci
          npm run build

      - name: Build web (space)
        working-directory: space
        run: |
          npm ci
          npm run build

      - name: Build Flutter web
        working-directory: flutter_app
        run: flutter build web

      - name: Build Flutter debug APK
        working-directory: flutter_app
        run: flutter build apk --debug

      - name: Leak scan
        run: bash scripts/leak-scan.sh
