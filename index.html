<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zyndio</title>
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <script>
    // TC-019 M1/M6 (Ava must-fix): set `dark` + `color-scheme` from the OS
    // setting before first paint (no flash of light theme) and keep it live.
    // Runs before the app bundle loads. lib/theme.ts
    // (applySystemTheme/watchSystemTheme) mirrors this for the React app and
    // is what's unit-tested.
    (function () {
      var mql = window.matchMedia('(prefers-color-scheme: dark)');
      function apply(isDark) {
        document.documentElement.classList.toggle('dark', isDark);
        document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
      }
      apply(mql.matches);
      mql.addEventListener('change', function (e) {
        apply(e.matches);
      });
    })();
  </script>
  <script type="module" src="./index.tsx"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f5f5f4;
      /* Stone 100 */
    }

    /* TC-019 M1: dark canvas before the app mounts, so the body behind the
       admin shell doesn't flash the light Stone 100 fill. */
    html.dark body {
      background-color: #070A14;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }

    /* TC-021 item 7: the thumb follows the theme (border.strong, dark). */
    html.dark::-webkit-scrollbar-thumb,
    html.dark ::-webkit-scrollbar-thumb {
      background: #6C7690;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>

<body>
  <div id="root"></div>
</body>

</html>
