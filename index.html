<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zyndio</title>
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <script>
    // TC-019 M1/M6 (Ava must-fix): set `dark` + `color-scheme` from the OS
    // setting before first paint (no flash of light theme) and keep it live.
    // Runs before Tailwind loads so the CDN build's initial class scan sees
    // it. lib/theme.ts (applySystemTheme/watchSystemTheme) mirrors this for
    // the React app and is what's unit-tested.
    (function () {
      var mql = window.matchMedia('(prefers-color-scheme: dark)');
      function apply(isDark) {
        document.documentElement.classList.toggle('dark', isDark);
        document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
      }
      apply(mql.matches);
      mql.addEventListener('change', function (e) {
        apply(e.matches);
      });
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      // TC-019: `dark:` applies under <html class="dark">, except inside a
      // `.light` surface (AuthCard: sign-in/2FA have no dark design yet).
      darkMode: ['variant', '&:is(.dark *):not(.light *)'],
      theme: {
        extend: Object.assign(
          {
            boxShadow: {
              'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
              'glow': '0 0 15px rgba(139, 92, 246, 0.3)',
            }
          },
          /*ZYNDIO_BRAND_THEME*/{}
        )
      }
    }
  </script>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <script type="importmap">
{

    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime",
    "react-router-dom": "https://esm.sh/react-router-dom@6.22.3?deps=react@18.2.0,react-dom@18.2.0",
    "lucide-react": "https://esm.sh/lucide-react@0.358.0?deps=react@18.2.0",

    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/"
  }
}
</script>
  <script type="module" src="./index.tsx"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f5f5f4;
      /* Stone 100 */
    }

    /* TC-019 M1: dark canvas before the app mounts, so the body behind the
       admin shell doesn't flash the light Stone 100 fill. */
    html.dark body {
      background-color: #070A14;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>

<body>
  <div id="root"></div>
</body>
