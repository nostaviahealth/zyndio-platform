name: zyndio_patient
description: "Zyndio - Health & Longevity Mobile Application"
publish_to: 'none'
version: 2.1.14+261

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Supabase
  supabase_flutter: ^2.8.0
  
  # Firebase
  firebase_core: ^3.6.0
  firebase_analytics: ^11.4.1
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^5.0.2
  
  # Meta Ads
  facebook_app_events: 0.27.0
  app_tracking_transparency: ^2.0.4
  
  # State Management
  flutter_riverpod: ^3.2.1
  riverpod_annotation: ^4.0.2
  
  # Navigation
  go_router: ^17.1.0
  
  # UI Components
  cupertino_icons: ^1.0.8
  lucide_icons_flutter: ^4.0.1
  google_fonts: ^8.0.1
  tutorial_coach_mark: ^1.2.14
  shimmer: ^3.0.0
  cached_network_image: ^3.3.0
  flutter_markdown: ^0.7.7+1
  
  # Charts
  fl_chart: ^1.1.1
  
  # PDF Generation
  pdf: ^3.11.1
  printing: ^5.13.4
  
  # Storage & Security
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.2.0
  
  # Utilities
  intl: ^0.20.2
  flutter_svg: ^2.0.10
  image_picker: ^1.1.2
  image_cropper: ^8.0.2
  url_launcher: ^6.2.0
  package_info_plus: ^9.0.0
  google_generative_ai: ^0.4.7
  http: ^1.2.0
  just_audio: ^0.10.5
  path_provider: ^2.1.1
  webview_flutter: ^4.8.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^6.1.4
  file_picker: ^11.0.2
  pdfx: ^2.6.0
  image: ^4.7.2
  badges: ^3.1.2
  health: ^13.3.1
  permission_handler: ^12.0.1
  xml: ^6.6.1
  # Native icon switching handled via MethodChannel (no plugin needed)

  # In-App Purchases (RevenueCat)
  purchases_flutter: ^8.2.0
  purchases_ui_flutter: ^8.2.0

  share_plus: ^10.1.2
  animations: ^2.0.11
  flutter_native_splash: ^2.4.0

  path: any
  wakelock_plus: ^1.5.2
  speech_to_text: ^7.3.0
  platform_wearables:
    path: ../packages/platform_wearables

dependency_overrides:
  freezed_annotation: ^2.4.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.3
  build_runner: ^2.4.8
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/icons/nav/
    # - assets/meditation/
  
  # fonts:
  #   - family: SF Pro Display
  #     fonts:
  #       - asset: fonts/SF-Pro-Display-Regular.otf
  #       - asset: fonts/SF-Pro-Display-Medium.otf
  #         weight: 500
  #       - asset: fonts/SF-Pro-Display-Bold.otf
  #         weight: 700

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/icons/splash_logo.png"
  # Optional: branding
  # branding: "assets/images/branding.png"
  # branding_bottom: true
  
  android_12:
    color: "#FFFFFF"
    image: "assets/icons/splash_logo.png"
    icon_background_color: "#FFFFFF"

  ios: true
  android: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  remove_alpha_ios: true
