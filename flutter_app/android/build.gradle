buildscript {
    ext.kotlin_version = '2.2.20'
    repositories {
        google()
        mavenCentral()
    }
    configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'org.jetbrains.kotlin' && 
                (details.requested.name == 'kotlin-build-tools-impl' || details.requested.name == 'kotlin-compiler-embeddable')) {
                details.useVersion "$kotlin_version"
            }
        }
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "org.jetbrains.kotlin:kotlin-build-tools-impl:$kotlin_version"
        classpath 'com.google.gms:google-services:4.4.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    
    buildscript {
        configurations.all {
            resolutionStrategy {
                force "org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.20"
            }
        }
    }

    configurations.all {
        resolutionStrategy {
            force "org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.20"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.2.20"
            force "org.jetbrains.kotlin:kotlin-stdlib:2.2.20"
            force "org.jetbrains.kotlin:kotlin-build-tools-impl:2.2.20"
            force "org.jetbrains.kotlin:kotlin-compiler-embeddable:2.2.20"
        }
    }
}

// Global project configuration
rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    
    // Inject modern Kotlin version dynamically to override legacy plugins (file_picker 1.8.22)
    project.ext.set('kotlin_version', '2.2.20')

    // Pin AndroidX deps for AGP 8.7.3 compatibility
    afterEvaluate { project ->
        project.ext.set('kotlin_version', '2.2.20')
        configurations.configureEach {
            resolutionStrategy {
                force 'androidx.core:core:1.15.0'
                force 'androidx.core:core-ktx:1.15.0'
                force 'androidx.activity:activity:1.10.1'
                force 'androidx.activity:activity-ktx:1.10.1'
                force 'androidx.browser:browser:1.8.0'
            }
            exclude group: 'androidx.navigationevent', module: 'navigationevent-android'
        }
    }
}

subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
