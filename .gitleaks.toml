# gitleaks config: default rules plus a narrow allowlist for CocoaPods lockfile checksums.
[extend]
useDefault = true

[allowlist]
description = "Podfile.lock checksums are public pod hashes. The one stopword is the old synthetic fixture string left in commit ebbed40; the live test no longer uses it. Rules stay on."
paths = ['''(^|/)Podfile( \d+)?\.lock$''']
stopwords = ["zpt_fixture_a1"]
